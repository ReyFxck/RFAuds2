name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Install host tools
        run: apk add --no-cache build-base git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch PS2SDK source rules
        run: git clone --depth 1 https://github.com/ps2dev/ps2sdk /tmp/ps2sdk-src

      - name: Build
        run: make clean check package PS2SDKSRC=/tmp/ps2sdk-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RFAuds2-${{ github.sha }}
          path: |
            build/librfauds2.a
            build/rfauds2.irx
            build/package/**
          if-no-files-found: error
